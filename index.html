<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Flow & Pressure Control - Multi Plant Client</title>
    <style>
        /* ==========================================
           1. GENERAL & LAYOUT STYLES (DARK THEME)
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #1E222A;
            color: #FFFFFF;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* DCS WORKSPACE MAIN CONTAINER */
        #dcs-workspace {
            display: flex;
            width: 100%;
            height: 100vh;
            padding: 10px;
            gap: 10px;
        }

        /* Yokogawa Faceplate Border Frame */
        .faceplate-border {
            background-color: #808080;
            padding: 2px;
            border: 2px outset #B0B0B0;
            width: 155px;
            flex-shrink: 0;
        }

        .faceplate {
            background-color: #C0C0C0;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 3px;
            color: #000;
        }

        .fp-header {
            background-color: #C0C0C0;
            border: 2px outset #FFF;
            padding: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 13px;
            line-height: 1.2;
            text-align: center;
        }

        .status-box {
            background-color: #000000;
            border: 2px inset #808080;
            height: 52px;
            margin: 3px 0;
            position: relative;
        }

        .ind-sq {
            position: absolute;
            top: 5px;
            left: 35px;
            width: 16px;
            height: 12px;
            background-color: #00FF00;
        }

        .lbl-mode-text {
            position: absolute;
            top: 18px;
            left: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            font-weight: bold;
            color: #00FFFF;
            white-space: pre;
        }

        .btn-ack {
            position: absolute;
            top: 12px;
            right: 8px;
            width: 38px;
            height: 25px;
            background-color: #4A5162;
            color: #FFF;
            border: 1px solid #000;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-mode {
            width: 100%;
            background-color: #3A404D;
            color: #FFF;
            border: 1px solid #000;
            font-weight: bold;
            font-size: 11px;
            padding: 3px;
            cursor: pointer;
            margin-bottom: 3px;
        }

        .readout-box {
            background-color: #000;
            border: 2px inset #808080;
            margin: 1px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1px 4px;
            font-family: 'Courier New', Courier, monospace;
            height: 22px;
        }

        .readout-box.clickable {
            cursor: pointer;
        }

        .readout-title {
            color: #FFF;
            font-size: 12px;
            font-weight: bold;
        }

        .readout-unit {
            color: #FFF;
            font-size: 11px;
        }

        .readout-val {
            color: #00FFFF;
            font-size: 13px;
            font-weight: bold;
        }

        #faceplateCanvas {
            background-color: #C0C0C0;
            margin-top: 2px;
            cursor: default;
            width: 100%;
        }

        /* Right Panel Container */
        .right-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .trend-frame {
            flex: 1;
            background-color: #2B303C;
            border: 2px inset #121417;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .trend-ctrl-bar {
            background-color: #1E222A;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: #00E676;
            font-weight: bold;
        }

        .trend-ctrl-bar select,
        .trend-ctrl-bar input {
            background-color: #2B303C;
            color: #FFF;
            border: 1px solid #3A404D;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            padding: 2px 4px;
        }

        /* Instructor Console Panel */
        .inst-frame {
            background-color: #2B303C;
            border: 2px solid #3A404D;
            padding: 6px 12px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .inst-sec {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }

        .inst-sec-title {
            color: #00E676;
            font-weight: bold;
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 11px;
        }

        .status-connected {
            background-color: #00E676;
            color: #000;
        }

        .status-disconnected {
            background-color: #FF1744;
            color: #FFF;
        }

        /* ==========================================
           2. MODAL DIALOG STYLES
           ========================================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-body {
            background-color: #2B303C;
            border: 2px solid #00E676;
            padding: 15px;
            min-width: 340px;
            box-shadow: 0 0 10px #000;
        }

        .modal-title {
            color: #00E676;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .modal-grid input[type="text"],
        .modal-grid select {
            background: #121417;
            color: #FFF;
            border: 1px solid #3A404D;
            padding: 3px;
            font-family: 'Consolas', monospace;
        }

        .modal-grid input:disabled {
            background: #252830;
            color: #666;
            border-color: #2A2D35;
        }

        .modal-btn-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .modal-btn {
            padding: 4px 12px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            border: none;
        }

        .btn-apply {
            background-color: #00E676;
            color: #000;
        }

        .btn-cancel {
            background-color: #808080;
            color: #FFF;
        }
    </style>
</head>

<body>
    <!-- MAIN DCS WORKSPACE -->
    <div id="dcs-workspace">
        <!-- YOKOGAWA FACEPLATE -->
        <div class="faceplate-border">
            <div class="faceplate">
                <div class="fp-header" id="fpPlantTitle">PID #1<br>Controller</div>

                <div class="status-box">
                    <div id="indSq" class="ind-sq"></div>
                    <div id="lblModeText" class="lbl-mode-text">AUT&#10;NR</div>
                    <button class="btn-ack" onclick="acknowledgeAlarm()">ACK</button>
                </div>

                <button class="btn-mode" onclick="openModeDialog()">MODE...</button>

                <!-- READOUTS -->
                <div class="readout-box">
                    <span class="readout-title">PV</span>
                    <span id="lblPvVal" class="readout-val" style="color: #11fa30;">0.0</span>
                    <span id="lblPvUnit" class="readout-unit">MMSCFD</span>
                </div>

                <div class="readout-box clickable" onclick="openValueDialog('SP')">
                    <span class="readout-title">SV</span>
                    <span id="lblSpVal" class="readout-val" style="color: #fc0b1f;">50.0</span>
                    <span id="lblSvUnit" class="readout-unit">MMSCFD</span>
                </div>

                <div class="readout-box clickable" onclick="openValueDialog('MV')">
                    <span class="readout-title">MV</span>
                    <span id="lblMvVal" class="readout-val" style="color: #ebe706;">0.0</span>
                    <span class="readout-unit">%</span>
                </div>

                <!-- READOUT KRITERIA KINERJA IAE -->
                <div class="readout-box clickable" onclick="resetIAE()" title="Klik untuk Reset IAE">
                    <span class="readout-title">IAE</span>
                    <span id="lblIaeVal" class="readout-val" style="color: #ff9800;">0.00</span>
                    <span class="readout-unit"></span>
                </div>

                <!-- GRAPHICAL FACEPLATE CANVAS -->
                <canvas id="faceplateCanvas" width="200" height="295"></canvas>
            </div>
        </div>

        <!-- RIGHT CONTAINER: TREND CHART & INSTRUCTOR PANEL -->
        <div class="right-container">
            <!-- TREND CHART PANEL -->
            <div class="trend-frame">
                <canvas id="trendCanvas" style="flex:1; width:100%; height:100%;"></canvas>
                <div class="trend-ctrl-bar">
                    <span>Pilih Plant Target:</span>
                    <select id="cbPlantSelect" onchange="changeActivePlant(this.value)">
                        <option value="0">Plant #1</option>
                        <option value="1">Plant #2</option>
                        <option value="2">Plant #3</option>
                        <option value="3">Plant #4</option>
                        <option value="4">Plant #5</option>
                    </select>

                    <span>Span Trend:</span>
                    <input type="number" id="txtTrendSpan" value="100" min="5" max="3600" style="width: 55px;" onchange="changeTrendSpan(this.value)">
                    <span>s</span>

                    <span>Refresh Rate:</span>
                    <select id="cbTrendRefresh" onchange="changeTrendRefresh(this.value)">
                        <option value="100" selected>100 ms</option>
                        <option value="500">500 ms</option>
                        <option value="1000">1 s</option>
                    </select>

                    <span>Nilai IAE:</span>
                    <span id="txtIaeVal" style="color: #FF9800; font-family: 'Consolas', monospace;">0.00</span>
                    <button class="btn-apply" onclick="resetIAE()" style="padding: 2px 6px; font-size: 10px;">Reset IAE</button>
                </div>
            </div>

            <!-- INSTRUCTOR CONSOLE / SERVER CONNECTION STATUS -->
            <div class="inst-frame">
                <div class="inst-sec">
                    <span class="inst-sec-title">Server IP:</span>
                    <input type="text" id="txtServerIp" value="127.0.0.1" style="width: 100px;">
                    <button class="btn-apply" onclick="reconnectServer()"
                        style="padding: 2px 8px; font-size: 11px;">Connect</button>
                </div>

                <div class="inst-sec">
                    <span class="inst-sec-title">Status Koneksi Plant Server:</span>
                    <span id="netStatusBadge" class="status-badge status-disconnected">TERPUTUS</span>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL DIALOGS -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-body">
            <div id="modalTitle" class="modal-title">Config Title</div>
            <div id="modalContent" class="modal-grid"></div>
            <div class="modal-btn-bar">
                <button class="modal-btn btn-apply" onclick="submitModal()">Apply / Save</button>
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        /* =================================================================
           STATE MANAJEMEN APLIKASI UI (Data murni diproses via WebSocket dari Python)
           ================================================================= */
        const state = {
            activePlantIndex: 0,
            plants: Array.from({ length: 5 }, () => ({
                sp_pct: 50.0,
                pv_pct: 0.0,
                mv: 0.0,
                mode: "AUT",
                iae: 0.0,
                // Local UI mirror parameter PID
                Kc: 1.0, Ti: 4.0, Td: 0.0, action: "REVERSE", valveType: "FC",
                enableLinearization: false, R: 50.0,
                // Buffer UI Trend
                spBuffer: [], pvBuffer: [], mvBuffer: [], timeBuffer: []
            })),

            sim_time: 0.0,
            dt: 0.1,
            eu_unit: "MMSCFD",
            eu_min: 0.0,
            eu_max: 100.0,
            
            trendSpanSec: 100,
            trendRefreshMs: 100,
            maxPoints: 1000,
            simTimer: null,

            alarmStatus: "NR",
            alarmAck: true,
            blinkState: false,

            ws: null,
            wsUrl: "ws://127.0.0.1:8765"
        };

        function pctToEu(pct) { return state.eu_min + (pct / 100.0) * (state.eu_max - state.eu_min); }
        function euToPct(eu) {
            let span = state.eu_max - state.eu_min;
            return span === 0 ? 0.0 : ((eu - state.eu_min) / span) * 100.0;
        }

        /* =================================================================
           KOMUNIKASI WEBSOCKET TERHUBUNG KE PLANT SERVER (Python HMI Channel)
           ================================================================= */
        function initWebSocket() {
            const ip = document.getElementById("txtServerIp").value.trim();
            state.wsUrl = `ws://${ip}:8765`;

            if (state.ws) {
                state.ws.close();
            }

            try {
                state.ws = new WebSocket(state.wsUrl);

                state.ws.onopen = () => {
                    const badge = document.getElementById("netStatusBadge");
                    badge.innerText = "TERHUBUNG";
                    badge.className = "status-badge status-connected";
                    sendEuMaxToServer(state.eu_max);
                };

                state.ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.eu_max !== undefined && data.eu_max !== state.eu_max) {
                        state.eu_max = data.eu_max;
                    }

                    if (data.pv && data.sp && data.mv) {
                        for (let i = 0; i < 5; i++) {
                            const p = state.plants[i];
                            p.pv_pct = euToPct(data.pv[i]);
                            p.sp_pct = euToPct(data.sp[i]);
                            p.mv = data.mv[i];
                            
                            if (data.mode) {
                                p.mode = data.mode[i];
                            }
                        }
                        updateUIReadouts();
                    }
                };

                state.ws.onclose = () => {
                    const badge = document.getElementById("netStatusBadge");
                    badge.innerText = "TERPUTUS";
                    badge.className = "status-badge status-disconnected";
                };

                state.ws.onerror = () => {
                    if (state.ws) state.ws.close();
                };
            } catch (e) {
                console.error("Gagal membuka WebSocket:", e);
            }
        }

        function reconnectServer() {
            initWebSocket();
        }

        // --- Network Helper Send Functions ---
        function sendSpToServer(plantIdx, spValPct) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({
                    command: "write_sp",
                    plant_index: plantIdx,
                    sp_value: pctToEu(spValPct)
                }));
            }
        }

        function sendMvToServer(plantIdx, mvVal) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({
                    command: "write_mv",
                    plant_index: plantIdx,
                    mv_value: mvVal
                }));
            }
        }

        function sendEuMaxToServer(euMaxVal) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({
                    command: "write_eu_max",
                    eu_max: euMaxVal
                }));
            }
        }

        function sendModeToServer(plantIdx, modeVal) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({
                    command: "write_mode",
                    plant_index: plantIdx,
                    mode: modeVal
                }));
            }
        }

        function sendPidParamsToServer(plantIdx, params) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                let payload = Object.assign({
                    command: "write_pid_params",
                    plant_index: plantIdx
                }, params);
                state.ws.send(JSON.stringify(payload));
            }
        }

        /* =================================================================
           SIKLUS EKSEKUSI GUI & SINKRONISASI TREND
           ================================================================= */
        function updateSimulation() {
            state.sim_time += state.dt;

            for (let i = 0; i < 5; i++) {
                const p = state.plants[i];
                const absError = Math.abs(pctToEu(p.sp_pct) - pctToEu(p.pv_pct));
                p.iae += absError * state.dt;

                p.spBuffer.push(pctToEu(p.sp_pct));
                p.pvBuffer.push(pctToEu(p.pv_pct));
                p.mvBuffer.push(p.mv);
                p.timeBuffer.push(state.sim_time);

                while (p.spBuffer.length > state.maxPoints) {
                    p.spBuffer.shift();
                    p.pvBuffer.shift();
                    p.mvBuffer.shift();
                    p.timeBuffer.shift();
                }
            }

            drawYokogawaFaceplate();
            drawTrendChart();
        }

        function updateUIReadouts() {
            const p = state.plants[state.activePlantIndex];
            document.getElementById("lblPvVal").innerText = pctToEu(p.pv_pct).toFixed(2);
            document.getElementById("lblSpVal").innerText = pctToEu(p.sp_pct).toFixed(2);
            document.getElementById("lblMvVal").innerText = p.mv.toFixed(1);
            document.getElementById("lblIaeVal").innerText = p.iae.toFixed(2);
            document.getElementById("txtIaeVal").innerText = p.iae.toFixed(2);
        }

        function resetIAE() {
            const p = state.plants[state.activePlantIndex];
            p.iae = 0.0;
            updateUIReadouts();
        }

        function changeActivePlant(val) {
            state.activePlantIndex = parseInt(val);
            document.getElementById("fpPlantTitle").innerHTML = `PID #${state.activePlantIndex + 1}<br>Controller`;
            updateUIReadouts();
        }

        /* =================================================================
           PENGATURAN REFRESH RATE & SPAN DYNAMIK TREND UI
           ================================================================= */
        function updateTrendConfig() {
            state.dt = state.trendRefreshMs / 1000.0;
            state.maxPoints = Math.max(10, Math.floor(state.trendSpanSec / state.dt));

            if (state.simTimer) clearInterval(state.simTimer);
            state.simTimer = setInterval(updateSimulation, state.trendRefreshMs);
        }

        function changeTrendRefresh(val) {
            state.trendRefreshMs = parseInt(val) || 100;
            updateTrendConfig();
        }

        function changeTrendSpan(val) {
            let v = parseFloat(val);
            if (!isNaN(v) && v > 0) {
                state.trendSpanSec = v;
                updateTrendConfig();
            }
        }

        /* =================================================================
           RENDER FACEPLATE & CANVAS (Identik dgn versi sebelumnya)
           ================================================================= */
        const fpCanvas = document.getElementById("faceplateCanvas");
        const fpCtx = fpCanvas.getContext("2d");

        function drawYokogawaFaceplate() {
            fpCtx.clearRect(0, 0, fpCanvas.width, fpCanvas.height);
            state.blinkState = !state.blinkState;

            const p = state.plants[state.activePlantIndex];

            let indSq = document.getElementById("indSq");
            let boxColor = "#00FF00";
            if (state.alarmStatus === "BAD") boxColor = (!state.alarmAck && state.blinkState) ? "#FF0000" : "#800080";
            else if (["HH", "LL"].includes(state.alarmStatus)) boxColor = (!state.alarmAck && state.blinkState) ? "#FF0000" : "#990000";
            else if (["HI", "LO"].includes(state.alarmStatus)) boxColor = (!state.alarmAck && state.blinkState) ? "#FFFF00" : "#999900";
            indSq.style.backgroundColor = boxColor;

            document.getElementById("lblModeText").innerText = `${p.mode}\n${state.alarmStatus}`;
            let btnAck = document.querySelector(".btn-ack");
            btnAck.style.backgroundColor = !state.alarmAck ? "#FF1744" : "#4A5162";

            const barTop = 25, barBottom = 232, barLeft = 88, barRight = 112;

            fpCtx.strokeStyle = "#505050";
            fpCtx.lineWidth = 2;
            fpCtx.fillStyle = "#000";
            fpCtx.fillRect(barLeft, barTop, barRight - barLeft, barBottom - barTop);
            fpCtx.strokeRect(barLeft, barTop, barRight - barLeft, barBottom - barTop);

            let pvH = (Math.max(0, Math.min(100, p.pv_pct)) / 100.0) * (barBottom - barTop);
            fpCtx.fillStyle = "#00FF00";
            fpCtx.fillRect(barLeft + 2, barBottom - pvH, (barRight - barLeft) - 4, pvH - 1);

            let mvY = barBottom - ((Math.max(0, Math.min(100, p.mv)) / 100.0) * (barBottom - barTop));
            fpCtx.fillStyle = "#FFFF00";
            fpCtx.beginPath();
            fpCtx.moveTo(barLeft - 2, mvY);
            fpCtx.lineTo(barLeft - 14, mvY - 7);
            fpCtx.lineTo(barLeft - 14, mvY + 7);
            fpCtx.closePath();
            fpCtx.fill(); fpCtx.stroke();

            let spY = barBottom - ((Math.max(0, Math.min(100, p.sp_pct)) / 100.0) * (barBottom - barTop));
            fpCtx.fillStyle = "#FF0000";
            fpCtx.beginPath();
            fpCtx.moveTo(barRight + 2, spY);
            fpCtx.lineTo(barRight + 14, spY - 7);
            fpCtx.lineTo(barRight + 14, spY + 7);
            fpCtx.closePath();
            fpCtx.fill(); fpCtx.stroke();

            fpCtx.fillStyle = "#505050";
            fpCtx.font = "bold 9px Arial";
            fpCtx.fillText("MV(%)", barLeft - 30, barTop - 10);
            for (let v = 100; v >= 0; v -= 20) {
                let yPos = barBottom - ((v / 100.0) * (barBottom - barTop));
                fpCtx.strokeStyle = "#000";
                fpCtx.beginPath(); fpCtx.moveTo(barLeft - 20, yPos); fpCtx.lineTo(barLeft - 16, yPos); fpCtx.stroke();
                fpCtx.fillStyle = "#000";
                fpCtx.font = "9px Consolas";
                fpCtx.fillText(v.toString(), barLeft - 36, yPos + 3);
            }

            fpCtx.fillStyle = "#505050";
            fpCtx.font = "bold 9px Arial";
            fpCtx.fillText(`PV/SV(${state.eu_unit})`, barRight + 10, barTop - 10);
            for (let v = 100; v >= 0; v -= 20) {
                let yPos = barBottom - ((v / 100.0) * (barBottom - barTop));
                let euVal = pctToEu(v);
                fpCtx.strokeStyle = "#000";
                fpCtx.beginPath(); fpCtx.moveTo(barRight + 16, yPos); fpCtx.lineTo(barRight + 20, yPos); fpCtx.stroke();
                fpCtx.fillStyle = "#000";
                fpCtx.font = "9px Consolas";
                fpCtx.fillText(euVal.toFixed(1), barRight + 24, yPos + 3);
            }

            fpCtx.fillStyle = "#0000A0";
            fpCtx.strokeStyle = "#00FFFF";
            fpCtx.lineWidth = 2;
            fpCtx.beginPath();
            fpCtx.moveTo(100, 258); fpCtx.lineTo(116, 274); fpCtx.lineTo(100, 290); fpCtx.lineTo(84, 274);
            fpCtx.closePath();
            fpCtx.fill(); fpCtx.stroke();
        }

        fpCanvas.addEventListener("click", (e) => {
            const rect = fpCanvas.getBoundingClientRect();
            let scaleX = fpCanvas.width / rect.width;
            let scaleY = fpCanvas.height / rect.height;
            let x = (e.clientX - rect.left) * scaleX;
            let y = (e.clientY - rect.top) * scaleY;
            if (x >= 84 && x <= 116 && y >= 258 && y <= 290) {
                openConfigDialog();
            }
        });

        const trendCanvas = document.getElementById("trendCanvas");
        const trendCtx = trendCanvas.getContext("2d");

        function drawTrendChart() {
            trendCanvas.width = trendCanvas.parentElement.clientWidth;
            trendCanvas.height = trendCanvas.parentElement.clientHeight - 30;

            let w = trendCanvas.width, h = trendCanvas.height;
            trendCtx.fillStyle = "#121417";
            trendCtx.fillRect(0, 0, w, h);

            let padL = 50, padR = 20, padB = 20;
            let chartH = h - padB;
            let topH = chartH * 0.58, botH = chartH * 0.32;
            let botTop = topH + 15;

            const numXDivs = 10;
            trendCtx.strokeStyle = "#2B303C";
            trendCtx.lineWidth = 1;

            const p = state.plants[state.activePlantIndex];

            let minT = p.timeBuffer.length > 0 ? p.timeBuffer[0] : 0.0;
            let maxT = p.timeBuffer.length >= state.maxPoints
                ? p.timeBuffer[p.timeBuffer.length - 1]
                : minT + (state.maxPoints * state.dt);

            for (let j = 0; j <= numXDivs; j++) {
                let x = padL + j * (w - padL - padR) / numXDivs;

                trendCtx.beginPath(); trendCtx.moveTo(x, 0); trendCtx.lineTo(x, topH); trendCtx.stroke();
                trendCtx.beginPath(); trendCtx.moveTo(x, botTop); trendCtx.lineTo(x, botTop + botH); trendCtx.stroke();

                let timeValAtDiv = minT + (j / numXDivs) * (maxT - minT);
                let timeStr = Math.round(timeValAtDiv) + "s";

                trendCtx.fillStyle = "#A0AAB0";
                trendCtx.font = "9px Arial";
                trendCtx.textAlign = "center";
                trendCtx.fillText(timeStr, x, botTop + botH + 14);
            }

            trendCtx.strokeStyle = "#2B303C";
            trendCtx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                let y = (topH / 4) * i;
                trendCtx.beginPath(); trendCtx.moveTo(padL, y); trendCtx.lineTo(w - padR, y); trendCtx.stroke();
            }

            let stepX = (w - padL - padR) / (state.maxPoints - 1);
            let currentLen = p.spBuffer.length;

            trendCtx.strokeStyle = "#FF0000";
            trendCtx.lineWidth = 1.5;
            trendCtx.beginPath();
            for (let i = 0; i < currentLen; i++) {
                let yPct = (p.spBuffer[i] - state.eu_min) / (state.eu_max - state.eu_min);
                let y = topH - (yPct * topH);
                let x = padL + i * stepX;
                if (i === 0) trendCtx.moveTo(x, y); else trendCtx.lineTo(x, y);
            }
            trendCtx.stroke();

            trendCtx.strokeStyle = "#00FF00";
            trendCtx.lineWidth = 1.8;
            trendCtx.beginPath();
            for (let i = 0; i < currentLen; i++) {
                let yPct = (p.pvBuffer[i] - state.eu_min) / (state.eu_max - state.eu_min);
                let y = topH - (yPct * topH);
                let x = padL + i * stepX;
                if (i === 0) trendCtx.moveTo(x, y); else trendCtx.lineTo(x, y);
            }
            trendCtx.stroke();

            trendCtx.strokeStyle = "#2B303C";
            for (let i = 0; i <= 2; i++) {
                let y = botTop + (botH / 2) * i;
                trendCtx.beginPath(); trendCtx.moveTo(padL, y); trendCtx.lineTo(w - padR, y); trendCtx.stroke();
            }

            trendCtx.strokeStyle = "#FFFF00";
            trendCtx.lineWidth = 1.5;
            trendCtx.beginPath();
            for (let i = 0; i < currentLen; i++) {
                let yPct = p.mvBuffer[i] / 100.0;
                let y = (botTop + botH) - (yPct * botH);
                let x = padL + i * stepX;
                if (i === 0) trendCtx.moveTo(x, y); else trendCtx.lineTo(x, y);
            }
            trendCtx.stroke();

            trendCtx.fillStyle = "#A0AAB0";
            trendCtx.font = "9px Arial";
            trendCtx.textAlign = "left";
            trendCtx.fillText(state.eu_max.toFixed(0), 10, 12);
            trendCtx.fillText(state.eu_min.toFixed(0), 10, topH);
            trendCtx.fillText("100%", 10, botTop + 10);
            trendCtx.fillText("0%", 10, botTop + botH);
        }

        /* =================================================================
           MODAL DIALOGS & ACTION HANDLERS
           ================================================================= */
        let activeModalCallback = null;

        function openModal(title, fieldsHtml, onApply) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalContent").innerHTML = fieldsHtml;
            document.getElementById("modalOverlay").style.display = "flex";
            activeModalCallback = onApply;
        }

        function closeModal() {
            document.getElementById("modalOverlay").style.display = "none";
            activeModalCallback = null;
        }

        function submitModal() {
            if (activeModalCallback) activeModalCallback();
            closeModal();
        }

        function toggleLinearizationRInput(val) {
            const rInput = document.getElementById("cfgR");
            if (rInput) {
                rInput.disabled = (val !== "ON");
            }
        }

        function openModeDialog() {
            const p = state.plants[state.activePlantIndex];
            let html = `
                <label><input type="radio" name="mOpt" value="AUT" ${p.mode === 'AUT' ? 'checked' : ''}> AUT</label>
                <label><input type="radio" name="mOpt" value="MAN" ${p.mode === 'MAN' ? 'checked' : ''}> MAN</label>
                <label><input type="radio" name="mOpt" value="CAS" ${p.mode === 'CAS' ? 'checked' : ''}> CAS</label>
            `;
            openModal("Select Target Mode", html, () => {
                let sel = document.querySelector('input[name="mOpt"]:checked');
                if (sel) {
                    p.mode = sel.value;
                    sendModeToServer(state.activePlantIndex, p.mode);
                }
            });
        }

        function openValueDialog(target) {
            const p = state.plants[state.activePlantIndex];
            if (target === "MV" && p.mode !== "MAN") {
                alert("Perubahan MV hanya diperbolehkan pada Mode MANUAL (MAN)!");
                return;
            }
            let currVal = target === "MV" ? p.mv : pctToEu(p.sp_pct);
            let html = `
                <label>Enter ${target} Target:</label>
                <input type="text" id="valInput" value="${currVal.toFixed(1)}">
            `;
            openModal(`Change ${target} Value`, html, () => {
                let v = parseFloat(document.getElementById("valInput").value);
                if (!isNaN(v)) {
                    if (target === "MV") {
                        p.mv = Math.max(0, Math.min(100, v));
                        sendMvToServer(state.activePlantIndex, p.mv);
                    } else {
                        let euVal = Math.max(state.eu_min, Math.min(state.eu_max, v));
                        p.sp_pct = euToPct(euVal);
                        sendSpToServer(state.activePlantIndex, p.sp_pct);
                    }
                }
            });
        }

        function openConfigDialog() {
            const p = state.plants[state.activePlantIndex];
            let isLinActive = p.enableLinearization;

            let html = `
                <label>Kc (Gain):</label><input type="text" id="cfgKc" value="${Math.abs(p.Kc)}">
                <label>Ti (s):</label><input type="text" id="cfgTi" value="${p.Ti}">
                <label>Td (s):</label><input type="text" id="cfgTd" value="${p.Td}">
                
                <label>Control Action:</label>
                <select id="cfgAction">
                    <option value="DIRECT" ${p.action === 'DIRECT' ? 'selected' : ''}>Direct Acting</option>
                    <option value="REVERSE" ${p.action === 'REVERSE' ? 'selected' : ''}>Reverse Acting</option>
                </select>

                <label>Tipe Valve:</label>
                <select id="cfgValveType">
                    <option value="FC" ${p.valveType === 'FC' ? 'selected' : ''}>FC (Fail Closed)</option>
                    <option value="FO" ${p.valveType === 'FO' ? 'selected' : ''}>FO (Fail Open)</option>
                </select>

                <label>Linierisasi Valve:</label>
                <select id="cfgLinear" onchange="toggleLinearizationRInput(this.value)">
                    <option value="OFF" ${!isLinActive ? 'selected' : ''}>NON-AKTIF</option>
                    <option value="ON" ${isLinActive ? 'selected' : ''}>AKTIF (Eq%)</option>
                </select>

                <label>Rangeability (R):</label>
                <input type="text" id="cfgR" value="${p.R}" ${!isLinActive ? 'disabled' : ''}>

                <label>EU Unit:</label><input type="text" id="cfgUnit" value="${state.eu_unit}">
                <label>EU Min:</label><input type="text" id="cfgMin" value="${state.eu_min}">
                <label>EU Max:</label><input type="text" id="cfgMax" value="${state.eu_max}">
            `;

            openModal(`Parameters Config (PID #${state.activePlantIndex + 1})`, html, () => {
                p.Kc = Math.abs(parseFloat(document.getElementById("cfgKc").value) || p.Kc);
                p.Ti = parseFloat(document.getElementById("cfgTi").value) || p.Ti;
                p.Td = parseFloat(document.getElementById("cfgTd").value) || p.Td;
                p.action = document.getElementById("cfgAction").value;
                p.valveType = document.getElementById("cfgValveType").value;
                p.enableLinearization = (document.getElementById("cfgLinear").value === "ON");
                p.R = parseFloat(document.getElementById("cfgR").value) || p.R;

                state.eu_unit = document.getElementById("cfgUnit").value || "%";
                state.eu_min = parseFloat(document.getElementById("cfgMin").value) || 0.0;
                
                let oldEuMax = state.eu_max;
                state.eu_max = parseFloat(document.getElementById("cfgMax").value) || 100.0;

                sendPidParamsToServer(state.activePlantIndex, {
                    Kc: p.Kc, Ti: p.Ti, Td: p.Td,
                    action: p.action, valveType: p.valveType,
                    enableLinearization: p.enableLinearization, R: p.R,
                    eu_min: state.eu_min
                });

                if (state.eu_max !== oldEuMax) {
                    sendEuMaxToServer(state.eu_max);
                }

                document.getElementById("lblPvUnit").innerText = state.eu_unit;
                document.getElementById("lblSvUnit").innerText = state.eu_unit;
            });
        }

        function acknowledgeAlarm() { state.alarmAck = true; }

        window.onload = () => {
            initWebSocket();
            drawYokogawaFaceplate();
            drawTrendChart();
            updateTrendConfig();
        };
    </script>
</body>
</html>
