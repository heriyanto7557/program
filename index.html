<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gas Flow & Pressure Control - Multi Plant Client</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1E222A;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .mobile-tab-bar {
            display: none;
            background-color: #15181E;
            border-bottom: 2px solid #3A404D;
            padding: 6px;
            gap: 6px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            background-color: #2B303C;
            color: #A0AAB0;
            border: 1px solid #3A404D;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .tab-btn.active {
            background-color: #00E676;
            color: #000;
            border-color: #00E676;
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
        }

        #dcs-workspace {
            display: flex;
            width: 100%;
            flex: 1;
            padding: 10px;
            gap: 10px;
            box-sizing: border-box;
            min-height: 0;
        }

        /* Yokogawa Faceplate Border Frame */
        .faceplate-border {
            background-color: #808080;
            padding: 3px;
            border: 2px outset #B0B0B0;
            width: 180px;
            flex-shrink: 0;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .faceplate {
            background-color: #C0C0C0;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 4px;
            color: #000;
            border-radius: 2px;
        }

        .fp-header {
            background-color: #C0C0C0;
            border: 2px outset #FFF;
            padding: 6px 4px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 13px;
            line-height: 1.2;
            text-align: center;
        }

        .status-box {
            background-color: #000000;
            border: 2px inset #808080;
            height: 54px;
            margin: 4px 0;
            position: relative;
        }

        .ind-sq {
            position: absolute;
            top: 6px;
            left: 35px;
            width: 18px;
            height: 14px;
            background-color: #00FF00;
            border-radius: 2px;
        }

        .lbl-mode-text {
            position: absolute;
            top: 20px;
            left: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            font-weight: bold;
            color: #00FFFF;
            white-space: pre;
        }

        .btn-ack {
            position: absolute;
            top: 10px;
            right: 8px;
            width: 44px;
            height: 32px;
            background-color: #4A5162;
            color: #FFF;
            border: 1px solid #000;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            touch-action: manipulation;
        }

        .btn-mode {
            width: 100%;
            background-color: #3A404D;
            color: #FFF;
            border: 1px solid #000;
            font-weight: bold;
            font-size: 12px;
            padding: 8px 4px;
            cursor: pointer;
            margin-bottom: 4px;
            border-radius: 3px;
            touch-action: manipulation;
        }

        .readout-box {
            background-color: #000;
            border: 2px inset #808080;
            margin: 2px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 6px;
            font-family: 'Courier New', Courier, monospace;
            min-height: 28px;
            border-radius: 2px;
        }

        .readout-box.clickable {
            cursor: pointer;
        }

        .readout-box.clickable:active {
            background-color: #1a1a1a;
        }

        .readout-title {
            color: #FFF;
            font-size: 13px;
            font-weight: bold;
        }

        .readout-unit {
            color: #FFF;
            font-size: 11px;
        }

        .readout-val {
            color: #00FFFF;
            font-size: 14px;
            font-weight: bold;
        }

        #faceplateCanvasContainer {
            width: 100%;
            margin-top: 4px;
            display: flex;
            justify-content: center;
        }

        #faceplateCanvas {
            background-color: #C0C0C0;
            cursor: default;
            width: 100%;
            max-width: 200px;
            height: auto;
        }

        .right-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
            min-height: 0;
        }

        .trend-frame {
            flex: 1;
            min-height: 320px;
            background-color: #2B303C;
            border: 2px inset #121417;
            display: flex;
            flex-direction: column;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
        }

        /* Dedicated Canvas Wrapper to break Flexbox feedback resize loop */
        .trend-canvas-wrap {
            flex: 1;
            position: relative;
            width: 100%;
            min-height: 0;
            overflow: hidden;
        }

        #trendCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .trend-ctrl-bar {
            background-color: #1E222A;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            font-size: 11px;
            color: #00E676;
            font-weight: bold;
            border-top: 1px solid #3A404D;
            flex-shrink: 0;
        }

        .trend-ctrl-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trend-ctrl-bar select,
        .trend-ctrl-bar input {
            background-color: #2B303C;
            color: #FFF;
            border: 1px solid #3A404D;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            padding: 4px 6px;
            border-radius: 3px;
        }

        .inst-frame {
            background-color: #2B303C;
            border: 2px solid #3A404D;
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            align-items: center;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .inst-sec {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            flex-wrap: wrap;
        }

        .inst-sec input[type="text"] {
            background-color: #121417;
            color: #FFF;
            border: 1px solid #3A404D;
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 3px;
        }

        .inst-sec-title {
            color: #00E676;
            font-weight: bold;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 11px;
        }

        .status-connected {
            background-color: #00E676;
            color: #000;
        }

        .status-disconnected {
            background-color: #FF1744;
            color: #FFF;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .modal-body {
            background-color: #2B303C;
            border: 2px solid #00E676;
            padding: 16px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            border-radius: 6px;
        }

        .modal-title {
            color: #00E676;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 14px;
            border-bottom: 1px solid #3A404D;
            padding-bottom: 6px;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            align-items: center;
            font-size: 12px;
            margin-bottom: 16px;
        }

        .modal-grid input[type="text"],
        .modal-grid input[type="number"],
        .modal-grid select {
            background: #121417;
            color: #FFF;
            border: 1px solid #3A404D;
            padding: 6px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            border-radius: 3px;
            width: 100%;
        }

        .modal-grid input:disabled {
            background: #252830;
            color: #666;
            border-color: #2A2D35;
        }

        .modal-btn-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-btn {
            padding: 8px 16px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            touch-action: manipulation;
        }

        .btn-apply {
            background-color: #00E676;
            color: #000;
        }

        .btn-cancel {
            background-color: #606060;
            color: #FFF;
        }

        @media (max-width: 768px) {
            .mobile-tab-bar {
                display: flex;
            }

            #dcs-workspace {
                flex-direction: column;
                padding: 6px;
                gap: 8px;
            }

            .faceplate-border {
                width: 100%;
                max-width: 320px;
                margin: 0 auto;
            }

            .right-container {
                width: 100%;
            }

            .trend-frame {
                min-height: 300px;
            }

            .modal-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .tab-content-hidden {
                display: none !important;
            }

            .inst-frame {
                flex-direction: column;
                align-items: stretch;
            }

            .inst-sec {
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

    <div class="mobile-tab-bar" id="mobileTabBar">
        <button class="tab-btn active" id="tabBtnController" onclick="switchMobileTab('controller')">🎛️ Faceplate</button>
        <button class="tab-btn" id="tabBtnTrend" onclick="switchMobileTab('trend')">📈 Trend Chart</button>
        <button class="tab-btn" id="tabBtnServer" onclick="switchMobileTab('server')">⚙️ Server & Config</button>
    </div>

    <div id="dcs-workspace">

        <!-- YOKOGAWA FACEPLATE SECTION -->
        <div class="faceplate-border" id="secFaceplate">
            <div class="faceplate">
                <div class="fp-header" id="fpPlantTitle">PID #1<br>Controller</div>

                <div class="status-box">
                    <div id="indSq" class="ind-sq"></div>
                    <div id="lblModeText" class="lbl-mode-text">AUT&#10;NR</div>
                    <button class="btn-ack" onclick="acknowledgeAlarm()">ACK</button>
                </div>

                <button class="btn-mode" onclick="openModeDialog()">MODE...</button>

                <!-- READOUTS -->
                <div class="readout-box">
                    <span class="readout-title">PV</span>
                    <span id="lblPvVal" class="readout-val" style="color: #11fa30;">0.0</span>
                    <span id="lblPvUnit" class="readout-unit">MMSCFD</span>
                </div>

                <div class="readout-box clickable" onclick="openValueDialog('SP')">
                    <span class="readout-title">SV</span>
                    <span id="lblSpVal" class="readout-val" style="color: #fc0b1f;">50.0</span>
                    <span id="lblSvUnit" class="readout-unit">MMSCFD</span>
                </div>

                <div class="readout-box clickable" onclick="openValueDialog('MV')">
                    <span class="readout-title">MV</span>
                    <span id="lblMvVal" class="readout-val" style="color: #ebe706;">0.0</span>
                    <span class="readout-unit">%</span>
                </div>

                <!-- READOUT KRITERIA KINERJA IAE -->
                <div class="readout-box clickable" onclick="resetIAE()" title="Klik untuk Reset IAE">
                    <span class="readout-title">IAE</span>
                    <span id="lblIaeVal" class="readout-val" style="color: #ff9800;">0.00</span>
                    <span class="readout-unit"></span>
                </div>

                <!-- GRAPHICAL FACEPLATE CANVAS -->
                <div id="faceplateCanvasContainer">
                    <canvas id="faceplateCanvas" width="200" height="295"></canvas>
                </div>
            </div>
        </div>

        <div class="right-container">
            <!-- TREND CHART PANEL -->
            <div class="trend-frame" id="secTrend">
                <div class="trend-canvas-wrap" id="trendCanvasWrap">
                    <canvas id="trendCanvas"></canvas>
                </div>
                <div class="trend-ctrl-bar">
                    <div class="trend-ctrl-group">
                        <span>Plant Target:</span>
                        <select id="cbPlantSelect" onchange="changeActivePlant(this.value)">
                            <option value="0">Plant #1</option>
                            <option value="1">Plant #2</option>
                            <option value="2">Plant #3</option>
                            <option value="3">Plant #4</option>
                            <option value="4">Plant #5</option>
                            <option value="5">Plant #6</option>
                            <option value="6">Plant #7</option>
                            <option value="7">Plant #8</option>
                            <option value="8">Plant #9</option>
                            <option value="9">Plant #10</option>
                        </select>
                    </div>

                    <div class="trend-ctrl-group">
                        <span>Span:</span>
                        <input type="number" id="txtTrendSpan" value="100" min="5" max="3600" style="width: 60px;" onchange="changeTrendSpan(this.value)">
                        <span>s</span>
                    </div>

                    <div class="trend-ctrl-group">
                        <span>Refresh:</span>
                        <select id="cbTrendRefresh" onchange="changeTrendRefresh(this.value)">
                            <option value="100" selected>100 ms</option>
                            <option value="500">500 ms</option>
                            <option value="1000">1 s</option>
                        </select>
                    </div>

                    <div class="trend-ctrl-group">
                        <span>Nilai IAE:</span>
                        <span id="txtIaeVal" style="color: #FF9800; font-family: 'Consolas', monospace; font-size: 13px;">0.00</span>
                        <button class="btn-apply" onclick="resetIAE()" style="padding: 3px 8px; font-size: 11px;">Reset</button>
                    </div>
                </div>
            </div>

            <!-- INSTRUCTOR CONSOLE / SERVER CONNECTION STATUS -->
            <div class="inst-frame" id="secServer">
                <div class="inst-sec">
                    <span class="inst-sec-title">Server IP:</span>
                    <input type="text" id="txtServerIp" value="127.0.0.1" style="width: 120px;">
                    <button class="btn-apply" onclick="reconnectServer()"
                        style="padding: 4px 10px; font-size: 11px;">Connect</button>
                </div>

                <div class="inst-sec">
                    <span class="inst-sec-title">Status Server:</span>
                    <span id="netStatusBadge" class="status-badge status-disconnected">TERPUTUS</span>
                </div>
            </div>
        </div>

    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-body">
            <div id="modalTitle" class="modal-title">Config Title</div>
            <div id="modalContent" class="modal-grid"></div>
            <div class="modal-btn-bar" id="modalBtnBar">
                <button class="modal-btn btn-apply" id="btnModalApply" onclick="submitModal()">Apply / Save</button>
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        /* =================================================================
           ALGORITMA PID CONTROLLER DENGAN LINIERISASI, DIRECT/REVERSE & FO/FC
           ================================================================= */
        class PIDController {
            constructor(Kc = 2.0, Ti = 4.0, Td = 0.05, sampleTime = 0.1) {
                this.Kc = Math.abs(Kc);
                this.Ti = Ti;
                this.Td = Td;
                this.sampleTime = sampleTime;
                this.integral = 0.0;
                this.prevError = 0.0;

                this.enableLinearization = false;
                this.R = 50.0;
                this.action = "REVERSE"; // "DIRECT" atau "REVERSE"
                this.valveType = "FC";  // "FC" (Fail Closed) atau "FO" (Fail Open)
            }

            applyLinearization(rawMv) {
                if (!this.enableLinearization) {
                    return rawMv;
                }
                let normMv = Math.max(0.0001, Math.min(1.0, rawMv / 100.0));
                let R_val = this.R <= 1 ? 50.0 : this.R;
                let linearized_x = 1.0 + (Math.log(normMv) / Math.log(R_val));
                let linearized_mv = linearized_x * 100.0;
                return Math.max(0.0, Math.min(100.0, linearized_mv));
            }

            getPlantMv(controllerOutput) {
                let mvSignal = controllerOutput;
                if (this.valveType === "FO") {
                    mvSignal = 100.0 - controllerOutput;
                }
                return this.applyLinearization(mvSignal);
            }

            compute(sp, pv, manualMv = null, mode = "AUT") {
                if (mode === "MAN") {
                    let targetMv = Math.max(0.0, Math.min(100.0, manualMv !== null ? manualMv : 0.0));
                    this.integral = targetMv;
                    return targetMv;
                }

                let error = sp - pv;
                let effectiveKc = (this.action === "DIRECT") ? -Math.abs(this.Kc) : Math.abs(this.Kc);
                let pTerm = effectiveKc * error;

                if (this.Ti > 0) {
                    this.integral += (effectiveKc / this.Ti) * error * this.sampleTime;
                    this.integral = Math.max(-100.0, Math.min(100.0, this.integral));
                } else {
                    this.integral = 0.0;
                }

                let derivative = (error - this.prevError) / this.sampleTime;
                this.prevError = error;
                let dTerm = effectiveKc * this.Td * derivative;

                let co = pTerm + this.integral + dTerm;
                co = Math.max(0.0, Math.min(100.0, co));

                return co;
            }
        }

        const NUM_PLANTS = 10;
        const state = {
            activePlantIndex: 0,
            plants: Array.from({ length: NUM_PLANTS }, () => ({
                pid: new PIDController(1.0, 4.0, 0.0, 0.1),
                sp_pct: 50.0,
                pv_pct: 0.0,
                mv: 0.0,
                mode: "AUT",
                iae: 0.0,
                spBuffer: [],
                pvBuffer: [],
                mvBuffer: [],
                timeBuffer: []
            })),

            sim_time: 0.0,
            dt: 0.1,
            eu_unit: "MMSCFD",
            eu_min: 0.0,
            eu_max: 100.0,
            
            trendSpanSec: 100,      // Default SPAN 100 detik
            trendRefreshMs: 100,    // Default 100 ms
            maxPoints: 1000,        // maxPoints = trendSpanSec / dt
            simTimer: null,         // Handle untuk setInterval

            alarmStatus: "NR",
            alarmAck: true,
            blinkState: false,

            ws: null,
            wsUrl: "ws://127.0.0.1:8765",
            currentTab: 'controller'
        };

        function pctToEu(pct) { return state.eu_min + (pct / 100.0) * (state.eu_max - state.eu_min); }
        function euToPct(eu) {
            let span = state.eu_max - state.eu_min;
            return span === 0 ? 0.0 : ((eu - state.eu_min) / span) * 100.0;
        }

        function switchMobileTab(tabName) {
            state.currentTab = tabName;
            const secFaceplate = document.getElementById("secFaceplate");
            const secTrend = document.getElementById("secTrend");
            const secServer = document.getElementById("secServer");

            const btnController = document.getElementById("tabBtnController");
            const btnTrend = document.getElementById("tabBtnTrend");
            const btnServer = document.getElementById("tabBtnServer");

            btnController.classList.remove("active");
            btnTrend.classList.remove("active");
            btnServer.classList.remove("active");

            if (window.innerWidth <= 768) {
                secFaceplate.classList.add("tab-content-hidden");
                secTrend.classList.add("tab-content-hidden");
                secServer.classList.add("tab-content-hidden");

                if (tabName === 'controller') {
                    secFaceplate.classList.remove("tab-content-hidden");
                    btnController.classList.add("active");
                } else if (tabName === 'trend') {
                    secTrend.classList.remove("tab-content-hidden");
                    btnTrend.classList.add("active");
                } else if (tabName === 'server') {
                    secServer.classList.remove("tab-content-hidden");
                    btnServer.classList.add("active");
                }
            } else {
                secFaceplate.classList.remove("tab-content-hidden");
                secTrend.classList.remove("tab-content-hidden");
                secServer.classList.remove("tab-content-hidden");
            }

            setTimeout(() => {
                drawTrendChart();
                drawYokogawaFaceplate();
            }, 50);
        }

        window.addEventListener("resize", () => {
            if (window.innerWidth > 768) {
                document.getElementById("secFaceplate").classList.remove("tab-content-hidden");
                document.getElementById("secTrend").classList.remove("tab-content-hidden");
                document.getElementById("secServer").classList.remove("tab-content-hidden");
            } else {
                switchMobileTab(state.currentTab);
            }
            drawTrendChart();
            drawYokogawaFaceplate();
        });

        function initWebSocket() {
            const ip = document.getElementById("txtServerIp").value.trim();
            state.wsUrl = `ws://${ip}:8765`;

            if (state.ws) {
                state.ws.close();
            }

            try {
                state.ws = new WebSocket(state.wsUrl);

                state.ws.onopen = () => {
                    const badge = document.getElementById("netStatusBadge");
                    badge.innerText = "TERHUBUNG";
                    badge.className = "status-badge status-connected";
                    
                    sendEuMaxToServer(state.eu_max);
                };

                state.ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.eu_max !== undefined && data.eu_max !== state.eu_max) {
                        state.eu_max = data.eu_max;
                    }

                    if (data.pv && data.sp && data.mv) {
                        for (let i = 0; i < NUM_PLANTS; i++) {
                            const p = state.plants[i];
                            p.pv_pct = euToPct(data.pv[i]);

                            if (p.mode === "AUT") {
                                const controllerOutput = p.pid.compute(p.sp_pct, p.pv_pct, p.mv, p.mode);
                                const plantMv = p.pid.getPlantMv(controllerOutput);
                                p.mv = controllerOutput;
                                sendMvToServer(i, plantMv);
                            }
                        }
                        updateUIReadouts();
                    }
                };

                state.ws.onclose = () => {
                    const badge = document.getElementById("netStatusBadge");
                    badge.innerText = "TERPUTUS";
                    badge.className = "status-badge status-disconnected";
                };

                state.ws.onerror = () => {
                    if (state.ws) state.ws.close();
                };
            } catch (e) {
                console.error("Gagal membuka WebSocket:", e);
            }
        }

        function reconnectServer() {
            initWebSocket();
        }

        function sendSpToServer(plantIdx, spVal) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({
                    command: "write_sp",
                    plant_index: plantIdx,
                    sp_value: pctToEu(spVal)
                }));
            }
        }

        function sendMvToServer(plantIdx, mvVal) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({
                    command: "write_mv",
                    plant_index: plantIdx,
                    mv_value: mvVal
                }));
            }
        }

        function sendEuMaxToServer(euMaxVal) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({
                    command: "write_eu_max",
                    eu_max: euMaxVal
                }));
            }
        }

        function updateSimulation() {
            state.sim_time += state.dt;

            for (let i = 0; i < NUM_PLANTS; i++) {
                const p = state.plants[i];

                const absError = Math.abs(pctToEu(p.sp_pct) - pctToEu(p.pv_pct));
                p.iae += absError * state.dt;

                p.spBuffer.push(pctToEu(p.sp_pct));
                p.pvBuffer.push(pctToEu(p.pv_pct));
                p.mvBuffer.push(p.mv);
                p.timeBuffer.push(state.sim_time);

                while (p.spBuffer.length > state.maxPoints) {
                    p.spBuffer.shift();
                    p.pvBuffer.shift();
                    p.mvBuffer.shift();
                    p.timeBuffer.shift();
                }
            }

            drawYokogawaFaceplate();
            drawTrendChart();
        }

        function updateUIReadouts() {
            const p = state.plants[state.activePlantIndex];
            document.getElementById("lblPvVal").innerText = pctToEu(p.pv_pct).toFixed(2);
            document.getElementById("lblSpVal").innerText = pctToEu(p.sp_pct).toFixed(2);
            document.getElementById("lblMvVal").innerText = p.mv.toFixed(1);
            document.getElementById("lblIaeVal").innerText = p.iae.toFixed(2);
            document.getElementById("txtIaeVal").innerText = p.iae.toFixed(2);
        }

        function resetIAE() {
            const p = state.plants[state.activePlantIndex];
            p.iae = 0.0;
            updateUIReadouts();
        }

        function changeActivePlant(val) {
            state.activePlantIndex = parseInt(val);
            document.getElementById("fpPlantTitle").innerHTML = `PID #${state.activePlantIndex + 1}<br>Controller`;
            updateUIReadouts();
        }

        function updateTrendConfig() {
            state.dt = state.trendRefreshMs / 1000.0;
            state.maxPoints = Math.max(10, Math.floor(state.trendSpanSec / state.dt));

            for (let i = 0; i < NUM_PLANTS; i++) {
                state.plants[i].pid.sampleTime = state.dt;
            }

            if (state.simTimer) {
                clearInterval(state.simTimer);
            }
            state.simTimer = setInterval(updateSimulation, state.trendRefreshMs);
        }

        function changeTrendRefresh(val) {
            state.trendRefreshMs = parseInt(val) || 100;
            updateTrendConfig();
        }

        function changeTrendSpan(val) {
            let v = parseFloat(val);
            if (!isNaN(v) && v > 0) {
                state.trendSpanSec = v;
                updateTrendConfig();
            }
        }

        const fpCanvas = document.getElementById("faceplateCanvas");
        const fpCtx = fpCanvas.getContext("2d");

        function drawYokogawaFaceplate() {
            fpCtx.clearRect(0, 0, fpCanvas.width, fpCanvas.height);
            state.blinkState = !state.blinkState;

            const p = state.plants[state.activePlantIndex];

            let indSq = document.getElementById("indSq");
            let boxColor = "#00FF00";
            if (state.alarmStatus === "BAD") boxColor = (!state.alarmAck && state.blinkState) ? "#FF0000" : "#800080";
            else if (["HH", "LL"].includes(state.alarmStatus)) boxColor = (!state.alarmAck && state.blinkState) ? "#FF0000" : "#990000";
            else if (["HI", "LO"].includes(state.alarmStatus)) boxColor = (!state.alarmAck && state.blinkState) ? "#FFFF00" : "#999900";
            indSq.style.backgroundColor = boxColor;

            document.getElementById("lblModeText").innerText = `${p.mode}\n${state.alarmStatus}`;
            let btnAck = document.querySelector(".btn-ack");
            btnAck.style.backgroundColor = !state.alarmAck ? "#FF1744" : "#4A5162";

            const barTop = 25, barBottom = 232, barLeft = 88, barRight = 112;

            fpCtx.strokeStyle = "#505050";
            fpCtx.lineWidth = 2;
            fpCtx.fillStyle = "#000";
            fpCtx.fillRect(barLeft, barTop, barRight - barLeft, barBottom - barTop);
            fpCtx.strokeRect(barLeft, barTop, barRight - barLeft, barBottom - barTop);

            let pvH = (Math.max(0, Math.min(100, p.pv_pct)) / 100.0) * (barBottom - barTop);
            fpCtx.fillStyle = "#00FF00";
            fpCtx.fillRect(barLeft + 2, barBottom - pvH, (barRight - barLeft) - 4, pvH - 1);

            let mvY = barBottom - ((Math.max(0, Math.min(100, p.mv)) / 100.0) * (barBottom - barTop));
            fpCtx.fillStyle = "#FFFF00";
            fpCtx.beginPath();
            fpCtx.moveTo(barLeft - 2, mvY);
            fpCtx.lineTo(barLeft - 14, mvY - 7);
            fpCtx.lineTo(barLeft - 14, mvY + 7);
            fpCtx.closePath();
            fpCtx.fill(); fpCtx.stroke();

            let spY = barBottom - ((Math.max(0, Math.min(100, p.sp_pct)) / 100.0) * (barBottom - barTop));
            fpCtx.fillStyle = "#FF0000";
            fpCtx.beginPath();
            fpCtx.moveTo(barRight + 2, spY);
            fpCtx.lineTo(barRight + 14, spY - 7);
            fpCtx.lineTo(barRight + 14, spY + 7);
            fpCtx.closePath();
            fpCtx.fill(); fpCtx.stroke();

            fpCtx.fillStyle = "#505050";
            fpCtx.font = "bold 9px Arial";
            fpCtx.fillText("MV(%)", barLeft - 30, barTop - 10);
            for (let v = 100; v >= 0; v -= 20) {
                let yPos = barBottom - ((v / 100.0) * (barBottom - barTop));
                fpCtx.strokeStyle = "#000";
                fpCtx.beginPath(); fpCtx.moveTo(barLeft - 20, yPos); fpCtx.lineTo(barLeft - 16, yPos); fpCtx.stroke();
                fpCtx.fillStyle = "#000";
                fpCtx.font = "9px Consolas";
                fpCtx.fillText(v.toString(), barLeft - 36, yPos + 3);
            }

            fpCtx.fillStyle = "#505050";
            fpCtx.font = "bold 9px Arial";
            fpCtx.fillText(`PV/SV(${state.eu_unit})`, barRight + 10, barTop - 10);
            for (let v = 100; v >= 0; v -= 20) {
                let yPos = barBottom - ((v / 100.0) * (barBottom - barTop));
                let euVal = pctToEu(v);
                fpCtx.strokeStyle = "#000";
                fpCtx.beginPath(); fpCtx.moveTo(barRight + 16, yPos); fpCtx.lineTo(barRight + 20, yPos); fpCtx.stroke();
                fpCtx.fillStyle = "#000";
                fpCtx.font = "9px Consolas";
                fpCtx.fillText(euVal.toFixed(1), barRight + 24, yPos + 3);
            }

            fpCtx.fillStyle = "#0000A0";
            fpCtx.strokeStyle = "#00FFFF";
            fpCtx.lineWidth = 2;
            fpCtx.beginPath();
            fpCtx.moveTo(100, 258); fpCtx.lineTo(116, 274); fpCtx.lineTo(100, 290); fpCtx.lineTo(84, 274);
            fpCtx.closePath();
            fpCtx.fill(); fpCtx.stroke();
        }

        fpCanvas.addEventListener("click", (e) => {
            const rect = fpCanvas.getBoundingClientRect();
            let scaleX = fpCanvas.width / rect.width;
            let scaleY = fpCanvas.height / rect.height;
            let x = (e.clientX - rect.left) * scaleX;
            let y = (e.clientY - rect.top) * scaleY;
            if (x >= 84 && x <= 116 && y >= 258 && y <= 290) {
                openConfigDialog();
            }
        });

        const trendCanvas = document.getElementById("trendCanvas");
        const trendCtx = trendCanvas.getContext("2d");

        function drawTrendChart() {
            let wrap = document.getElementById("trendCanvasWrap");
            if (!wrap) return;

            let w = wrap.clientWidth || 300;
            let h = wrap.clientHeight || 220;

            if (w <= 0 || h <= 0) return;

            // Decouple canvas element resize from parent container layout bounds
            trendCanvas.width = w;
            trendCanvas.height = h;

            trendCtx.fillStyle = "#121417";
            trendCtx.fillRect(0, 0, w, h);

            let padL = 45, padR = 15, padB = 20;
            let chartH = h - padB;
            let topH = chartH * 0.58, botH = chartH * 0.32;
            let botTop = topH + 15;

            const numXDivs = w < 480 ? 5 : 10;
            trendCtx.strokeStyle = "#2B303C";
            trendCtx.lineWidth = 1;

            const p = state.plants[state.activePlantIndex];

            let minT = p.timeBuffer.length > 0 ? p.timeBuffer[0] : 0.0;
            let maxT = p.timeBuffer.length >= state.maxPoints
                ? p.timeBuffer[p.timeBuffer.length - 1]
                : minT + (state.maxPoints * state.dt);

            for (let j = 0; j <= numXDivs; j++) {
                let x = padL + j * (w - padL - padR) / numXDivs;

                trendCtx.beginPath(); trendCtx.moveTo(x, 0); trendCtx.lineTo(x, topH); trendCtx.stroke();
                trendCtx.beginPath(); trendCtx.moveTo(x, botTop); trendCtx.lineTo(x, botTop + botH); trendCtx.stroke();

                let timeValAtDiv = minT + (j / numXDivs) * (maxT - minT);
                let timeStr = Math.round(timeValAtDiv) + "s";

                trendCtx.fillStyle = "#A0AAB0";
                trendCtx.font = "9px Arial";
                trendCtx.textAlign = "center";
                trendCtx.fillText(timeStr, x, botTop + botH + 14);
            }

            trendCtx.strokeStyle = "#2B303C";
            trendCtx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                let y = (topH / 4) * i;
                trendCtx.beginPath(); trendCtx.moveTo(padL, y); trendCtx.lineTo(w - padR, y); trendCtx.stroke();
            }

            let stepX = (w - padL - padR) / Math.max(1, (state.maxPoints - 1));
            let currentLen = p.spBuffer.length;

            // Trend SV (Merah)
            trendCtx.strokeStyle = "#FF0000";
            trendCtx.lineWidth = 1.5;
            trendCtx.beginPath();
            for (let i = 0; i < currentLen; i++) {
                let yPct = (p.spBuffer[i] - state.eu_min) / (state.eu_max - state.eu_min);
                let y = topH - (yPct * topH);
                let x = padL + i * stepX;
                if (i === 0) trendCtx.moveTo(x, y); else trendCtx.lineTo(x, y);
            }
            trendCtx.stroke();

            // Trend PV (Hijau)
            trendCtx.strokeStyle = "#00FF00";
            trendCtx.lineWidth = 1.8;
            trendCtx.beginPath();
            for (let i = 0; i < currentLen; i++) {
                let yPct = (p.pvBuffer[i] - state.eu_min) / (state.eu_max - state.eu_min);
                let y = topH - (yPct * topH);
                let x = padL + i * stepX;
                if (i === 0) trendCtx.moveTo(x, y); else trendCtx.lineTo(x, y);
            }
            trendCtx.stroke();

            trendCtx.strokeStyle = "#2B303C";
            for (let i = 0; i <= 2; i++) {
                let y = botTop + (botH / 2) * i;
                trendCtx.beginPath(); trendCtx.moveTo(padL, y); trendCtx.lineTo(w - padR, y); trendCtx.stroke();
            }

            // Trend MV (Kuning)
            trendCtx.strokeStyle = "#FFFF00";
            trendCtx.lineWidth = 1.5;
            trendCtx.beginPath();
            for (let i = 0; i < currentLen; i++) {
                let yPct = p.mvBuffer[i] / 100.0;
                let y = (botTop + botH) - (yPct * botH);
                let x = padL + i * stepX;
                if (i === 0) trendCtx.moveTo(x, y); else trendCtx.lineTo(x, y);
            }
            trendCtx.stroke();

            trendCtx.fillStyle = "#A0AAB0";
            trendCtx.font = "9px Arial";
            trendCtx.textAlign = "left";
            trendCtx.fillText(state.eu_max.toFixed(0), 5, 12);
            trendCtx.fillText(state.eu_min.toFixed(0), 5, topH);
            trendCtx.fillText("100%", 5, botTop + 10);
            trendCtx.fillText("0%", 5, botTop + botH);
        }

        let activeModalCallback = null;

        function openModal(title, fieldsHtml, onApply, showApplyBtn = true) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalContent").innerHTML = fieldsHtml;
            document.getElementById("btnModalApply").style.display = showApplyBtn ? "inline-block" : "none";
            document.getElementById("modalOverlay").style.display = "flex";
            activeModalCallback = onApply;
        }

        function closeModal() {
            document.getElementById("modalOverlay").style.display = "none";
            activeModalCallback = null;
        }

        function submitModal() {
            if (activeModalCallback) activeModalCallback();
            closeModal();
        }

        function toggleLinearizationRInput(val) {
            const rInput = document.getElementById("cfgR");
            if (rInput) {
                rInput.disabled = (val !== "ON");
            }
        }

        function openModeDialog() {
            const p = state.plants[state.activePlantIndex];
            let html = `
                <label style="grid-column: 1 / -1;"><input type="radio" name="mOpt" value="AUT" ${p.mode === 'AUT' ? 'checked' : ''}> AUT (Automatic)</label>
                <label style="grid-column: 1 / -1;"><input type="radio" name="mOpt" value="MAN" ${p.mode === 'MAN' ? 'checked' : ''}> MAN (Manual)</label>
                <label style="grid-column: 1 / -1;"><input type="radio" name="mOpt" value="CAS" ${p.mode === 'CAS' ? 'checked' : ''}> CAS (Cascade)</label>
            `;
            openModal("Select Target Mode", html, () => {
                let sel = document.querySelector('input[name="mOpt"]:checked');
                if (sel) p.mode = sel.value;
            });
        }

        function openValueDialog(target) {
            const p = state.plants[state.activePlantIndex];
            if (target === "MV" && p.mode !== "MAN") {
                openModal("Peringatan", "<p style='color:#FF1744; grid-column:1/-1;'>Perubahan MV hanya diperbolehkan pada Mode MANUAL (MAN)!</p>", null, false);
                return;
            }
            let currVal = target === "MV" ? p.mv : pctToEu(p.sp_pct);
            let html = `
                <label>Enter ${target} Target Value:</label>
                <input type="number" id="valInput" step="any" value="${currVal.toFixed(1)}">
            `;
            openModal(`Change ${target} Value`, html, () => {
                let v = parseFloat(document.getElementById("valInput").value);
                if (!isNaN(v)) {
                    if (target === "MV") {
                        p.mv = Math.max(0, Math.min(100, v));
                        sendMvToServer(state.activePlantIndex, p.pid.getPlantMv(p.mv));
                    } else {
                        p.sp_pct = euToPct(Math.max(state.eu_min, Math.min(state.eu_max, v)));
                        sendSpToServer(state.activePlantIndex, p.sp_pct);
                    }
                }
            });
        }

        function openConfigDialog() {
            const p = state.plants[state.activePlantIndex];
            let isLinActive = p.pid.enableLinearization;

            let html = `
                <label>Kc (Gain):</label><input type="number" id="cfgKc" step="any" value="${Math.abs(p.pid.Kc)}">
                <label>Ti (s):</label><input type="number" id="cfgTi" step="any" value="${p.pid.Ti}">
                <label>Td (s):</label><input type="number" id="cfgTd" step="any" value="${p.pid.Td}">
                
                <label>Control Action:</label>
                <select id="cfgAction">
                    <option value="DIRECT" ${p.pid.action === 'DIRECT' ? 'selected' : ''}>Direct Acting</option>
                    <option value="REVERSE" ${p.pid.action === 'REVERSE' ? 'selected' : ''}>Reverse Acting</option>
                </select>

                <label>Tipe Valve:</label>
                <select id="cfgValveType">
                    <option value="FC" ${p.pid.valveType === 'FC' ? 'selected' : ''}>FC (Fail Closed)</option>
                    <option value="FO" ${p.pid.valveType === 'FO' ? 'selected' : ''}>FO (Fail Open)</option>
                </select>

                <label>Linierisasi Valve:</label>
                <select id="cfgLinear" onchange="toggleLinearizationRInput(this.value)">
                    <option value="OFF" ${!isLinActive ? 'selected' : ''}>NON-AKTIF</option>
                    <option value="ON" ${isLinActive ? 'selected' : ''}>AKTIF (Eq%)</option>
                </select>

                <label>Rangeability (R):</label>
                <input type="number" id="cfgR" step="any" value="${p.pid.R}" ${!isLinActive ? 'disabled' : ''}>

                <label>EU Unit:</label><input type="text" id="cfgUnit" value="${state.eu_unit}">
                <label>EU Min:</label><input type="number" id="cfgMin" step="any" value="${state.eu_min}">
                <label>EU Max:</label><input type="number" id="cfgMax" value="${state.eu_max}">
            `;

            openModal(`Parameters Config (PID #${state.activePlantIndex + 1})`, html, () => {
                p.pid.Kc = Math.abs(parseFloat(document.getElementById("cfgKc").value) || p.pid.Kc);
                p.pid.Ti = parseFloat(document.getElementById("cfgTi").value) || p.pid.Ti;
                p.pid.Td = parseFloat(document.getElementById("cfgTd").value) || p.pid.Td;

                p.pid.action = document.getElementById("cfgAction").value;
                p.pid.valveType = document.getElementById("cfgValveType").value;

                p.pid.enableLinearization = (document.getElementById("cfgLinear").value === "ON");
                p.pid.R = parseFloat(document.getElementById("cfgR").value) || p.pid.R;

                state.eu_unit = document.getElementById("cfgUnit").value || "%";
                state.eu_min = parseFloat(document.getElementById("cfgMin").value) || 0.0;
                
                let oldEuMax = state.eu_max;
                state.eu_max = parseFloat(document.getElementById("cfgMax").value) || 100.0;

                if (state.eu_max !== oldEuMax) {
                    sendEuMaxToServer(state.eu_max);
                }

                document.getElementById("lblPvUnit").innerText = state.eu_unit;
                document.getElementById("lblSvUnit").innerText = state.eu_unit;
            });
        }

        function acknowledgeAlarm() { state.alarmAck = true; }

        window.onload = () => {
            initWebSocket();
            if (window.innerWidth <= 768) {
                switchMobileTab('controller');
            } else {
                drawYokogawaFaceplate();
                drawTrendChart();
            }
            updateTrendConfig();
        };
    </script>

</body>

</html>
