<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gas Flow & Pressure Control - Multi Plant Client</title>
    <style>
        /* ==========================================
           1. GENERAL & VIEWPORT LOCKED STYLES
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden; /* Mencegah halaman memanjang atau scroll vertikal */
            background-color: #1E222A;
            color: #FFFFFF;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* MOBILE TAB BAR */
        .mobile-tab-bar {
            display: none;
            height: 44px;
            background-color: #15181E;
            border-bottom: 2px solid #3A404D;
            padding: 4px;
            gap: 4px;
            flex-shrink: 0;
            z-index: 100;
        }

        .tab-btn {
            flex: 1;
            background-color: #2B303C;
            color: #A0AAB0;
            border: 1px solid #3A404D;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            touch-action: manipulation;
        }

        .tab-btn.active {
            background-color: #00E676;
            color: #000;
            border-color: #00E676;
        }

        /* DCS WORKSPACE MAIN CONTAINER */
        #dcs-workspace {
            display: flex;
            width: 100%;
            flex: 1;
            min-height: 0;
            padding: 8px;
            gap: 8px;
            overflow: hidden;
        }

        /* Yokogawa Faceplate Border Frame */
        .faceplate-border {
            background-color: #808080;
            padding: 3px;
            border: 2px outset #B0B0B0;
            width: 185px;
            height: 100%;
            flex-shrink: 0;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .faceplate {
            background-color: #C0C0C0;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 4px;
            color: #000;
            border-radius: 2px;
            min-height: 0;
        }

        .fp-header {
            background-color: #C0C0C0;
            border: 2px outset #FFF;
            padding: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            flex-shrink: 0;
        }

        .status-box {
            background-color: #000000;
            border: 2px inset #808080;
            height: 48px;
            margin: 3px 0;
            position: relative;
            flex-shrink: 0;
        }

        .ind-sq {
            position: absolute;
            top: 4px;
            left: 30px;
            width: 16px;
            height: 12px;
            background-color: #00FF00;
            border-radius: 2px;
        }

        .lbl-mode-text {
            position: absolute;
            top: 18px;
            left: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            font-weight: bold;
            color: #00FFFF;
            white-space: pre;
        }

        .btn-ack {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 38px;
            height: 28px;
            background-color: #4A5162;
            color: #FFF;
            border: 1px solid #000;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .btn-mode {
            width: 100%;
            background-color: #3A404D;
            color: #FFF;
            border: 1px solid #000;
            font-weight: bold;
            font-size: 11px;
            padding: 6px 2px;
            cursor: pointer;
            margin-bottom: 3px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .readout-box {
            background-color: #000;
            border: 2px inset #808080;
            margin: 2px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
            font-family: 'Courier New', Courier, monospace;
            height: 26px;
            flex-shrink: 0;
            border-radius: 2px;
        }

        .readout-box.clickable {
            cursor: pointer;
        }

        .readout-title {
            color: #FFF;
            font-size: 12px;
            font-weight: bold;
        }

        .readout-unit {
            color: #FFF;
            font-size: 10px;
        }

        .readout-val {
            color: #00FFFF;
            font-size: 13px;
            font-weight: bold;
        }

        #faceplateCanvasContainer {
            flex: 1;
            width: 100%;
            margin-top: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
            position: relative;
        }

        #faceplateCanvas {
            background-color: #C0C0C0;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Right Container */
        .right-container {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            overflow: hidden;
        }

        .trend-frame {
            flex: 1;
            min-height: 0;
            background-color: #2B303C;
            border: 2px inset #121417;
            display: flex;
            flex-direction: column;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
        }

        .trend-canvas-wrap {
            flex: 1;
            min-height: 0;
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        #trendCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .trend-ctrl-bar {
            background-color: #1E222A;
            padding: 6px 8px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            font-size: 11px;
            color: #00E676;
            font-weight: bold;
            border-top: 1px solid #3A404D;
            flex-shrink: 0;
        }

        .trend-ctrl-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .trend-ctrl-bar select,
        .trend-ctrl-bar input {
            background-color: #2B303C;
            color: #FFF;
            border: 1px solid #3A404D;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            padding: 3px 4px;
            border-radius: 3px;
        }

        .inst-frame {
            background-color: #2B303C;
            border: 2px solid #3A404D;
            padding: 6px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .inst-sec {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }

        .inst-sec input[type="text"] {
            background-color: #121417;
            color: #FFF;
            border: 1px solid #3A404D;
            padding: 4px 6px;
            font-size: 11px;
            border-radius: 3px;
        }

        .inst-sec-title {
            color: #00E676;
            font-weight: bold;
        }

        .status-badge {
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 10px;
        }

        .status-connected { background-color: #00E676; color: #000; }
        .status-disconnected { background-color: #FF1744; color: #FFF; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .modal-body {
            background-color: #2B303C;
            border: 2px solid #00E676;
            padding: 14px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 6px;
        }

        .modal-title {
            color: #00E676;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #3A404D;
            padding-bottom: 4px;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            align-items: center;
            font-size: 11px;
            margin-bottom: 12px;
        }

        .modal-grid input, .modal-grid select {
            background: #121417;
            color: #FFF;
            border: 1px solid #3A404D;
            padding: 5px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            border-radius: 3px;
            width: 100%;
        }

        .modal-btn-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .modal-btn {
            padding: 6px 12px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            border: none;
            border-radius: 3px;
        }

        .btn-apply { background-color: #00E676; color: #000; }
        .btn-cancel { background-color: #606060; color: #FFF; }

        /* MEDIA QUERY MOBILE */
        @media (max-width: 768px) {
            .mobile-tab-bar { display: flex; }
            #dcs-workspace {
                height: calc(100vh - 44px);
                height: calc(100dvh - 44px);
                flex-direction: column;
                padding: 4px;
            }
            .faceplate-border, .right-container {
                width: 100%;
                height: 100%;
            }
            .tab-content-hidden { display: none !important; }
            .inst-frame { flex-direction: column; align-items: stretch; gap: 6px; }
            .inst-sec { justify-content: space-between; }
        }
    </style>
</head>
<body>
    <!-- MOBILE TAB BAR -->
    <div class="mobile-tab-bar" id="mobileTabBar">
        <button class="tab-btn active" id="tabBtnController" onclick="switchMobileTab('controller')">🎛️ Faceplate</button>
        <button class="tab-btn" id="tabBtnTrend" onclick="switchMobileTab('trend')">📈 Trend</button>
        <button class="tab-btn" id="tabBtnServer" onclick="switchMobileTab('server')">⚙️ Server</button>
    </div>

    <!-- DCS WORKSPACE -->
    <div id="dcs-workspace">
        <!-- YOKOGAWA FACEPLATE -->
        <div class="faceplate-border" id="secFaceplate">
            <div class="faceplate">
                <div class="fp-header" id="fpPlantTitle">PID #1<br>Controller</div>

                <div class="status-box">
                    <div id="indSq" class="ind-sq"></div>
                    <div id="lblModeText" class="lbl-mode-text">AUT&#10;NR</div>
                    <button class="btn-ack" onclick="acknowledgeAlarm()">ACK</button>
                </div>

                <button class="btn-mode" onclick="openModeDialog()">MODE...</button>

                <div class="readout-box">
                    <span class="readout-title">PV</span>
                    <span id="lblPvVal" class="readout-val" style="color: #11fa30;">0.0</span>
                    <span id="lblPvUnit" class="readout-unit">MMSCFD</span>
                </div>

                <div class="readout-box clickable" onclick="openValueDialog('SP')">
                    <span class="readout-title">SV</span>
                    <span id="lblSpVal" class="readout-val" style="color: #fc0b1f;">50.0</span>
                    <span id="lblSvUnit" class="readout-unit">MMSCFD</span>
                </div>

                <div class="readout-box clickable" onclick="openValueDialog('MV')">
                    <span class="readout-title">MV</span>
                    <span id="lblMvVal" class="readout-val" style="color: #ebe706;">0.0</span>
                    <span class="readout-unit">%</span>
                </div>

                <div class="readout-box clickable" onclick="resetIAE()" title="Klik untuk Reset IAE">
                    <span class="readout-title">IAE</span>
                    <span id="lblIaeVal" class="readout-val" style="color: #ff9800;">0.00</span>
                    <span class="readout-unit"></span>
                </div>

                <div id="faceplateCanvasContainer">
                    <canvas id="faceplateCanvas" width="200" height="295"></canvas>
                </div>
            </div>
        </div>

        <!-- RIGHT CONTAINER (TREND & SERVER) -->
        <div class="right-container">
            <div class="trend-frame" id="secTrend">
                <div class="trend-canvas-wrap" id="trendCanvasWrap">
                    <canvas id="trendCanvas"></canvas>
                </div>
                <div class="trend-ctrl-bar">
                    <div class="trend-ctrl-group">
                        <span>Plant:</span>
                        <select id="cbPlantSelect" onchange="changeActivePlant(this.value)">
                            <option value="0">Plant #1</option>
                            <option value="1">Plant #2</option>
                            <option value="2">Plant #3</option>
                            <option value="3">Plant #4</option>
                            <option value="4">Plant #5</option>
                        </select>
                    </div>

                    <div class="trend-ctrl-group">
                        <span>Span:</span>
                        <input type="number" id="txtTrendSpan" value="100" min="5" max="3600" style="width: 50px;" onchange="changeTrendSpan(this.value)">
                        <span>s</span>
                    </div>

                    <div class="trend-ctrl-group">
                        <span>Refresh:</span>
                        <select id="cbTrendRefresh" onchange="changeTrendRefresh(this.value)">
                            <option value="100" selected>100ms</option>
                            <option value="500">500ms</option>
                            <option value="1000">1s</option>
                        </select>
                    </div>

                    <div class="trend-ctrl-group">
                        <span>IAE:</span>
                        <span id="txtIaeVal" style="color: #FF9800;">0.00</span>
                        <button class="btn-apply" onclick="resetIAE()" style="padding: 2px 6px; font-size: 10px;">Reset</button>
                    </div>
                </div>
            </div>

            <div class="inst-frame" id="secServer">
                <div class="inst-sec">
                    <span class="inst-sec-title">Server IP:</span>
                    <input type="text" id="txtServerIp" value="127.0.0.1" style="width: 100px;">
                    <button class="btn-apply" onclick="reconnectServer()" style="padding: 3px 8px; font-size: 10px;">Connect</button>
                </div>

                <div class="inst-sec">
                    <span class="inst-sec-title">Status:</span>
                    <span id="netStatusBadge" class="status-badge status-disconnected">TERPUTUS</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DIALOGS -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-body">
            <div id="modalTitle" class="modal-title">Config Title</div>
            <div id="modalContent" class="modal-grid"></div>
            <div class="modal-btn-bar" id="modalBtnBar">
                <button class="modal-btn btn-apply" id="btnModalApply" onclick="submitModal()">Apply</button>
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const state = {
            activePlantIndex: 0,
            plants: Array.from({ length: 5 }, () => ({
                sp_pct: 50.0, pv_pct: 0.0, mv: 0.0, mode: "AUT", iae: 0.0,
                Kc: 1.0, Ti: 4.0, Td: 0.0, action: "REVERSE", valveType: "FC",
                enableLinearization: false, R: 50.0,
                spBuffer: [], pvBuffer: [], mvBuffer: [], timeBuffer: []
            })),
            sim_time: 0.0, dt: 0.1, eu_unit: "MMSCFD", eu_min: 0.0, eu_max: 100.0,
            trendSpanSec: 100, trendRefreshMs: 100, maxPoints: 1000, simTimer: null,
            alarmStatus: "NR", alarmAck: true, blinkState: false,
            ws: null, wsUrl: "ws://127.0.0.1:8765", currentTab: 'controller'
        };

        function pctToEu(pct) { return state.eu_min + (pct / 100.0) * (state.eu_max - state.eu_min); }
        function euToPct(eu) {
            let span = state.eu_max - state.eu_min;
            return span === 0 ? 0.0 : ((eu - state.eu_min) / span) * 100.0;
        }

        function switchMobileTab(tabName) {
            state.currentTab = tabName;
            const secFaceplate = document.getElementById("secFaceplate");
            const secTrend = document.getElementById("secTrend");
            const secServer = document.getElementById("secServer");

            const btnController = document.getElementById("tabBtnController");
            const btnTrend = document.getElementById("tabBtnTrend");
            const btnServer = document.getElementById("tabBtnServer");

            btnController.classList.remove("active");
            btnTrend.classList.remove("active");
            btnServer.classList.remove("active");

            if (window.innerWidth <= 768) {
                secFaceplate.classList.add("tab-content-hidden");
                secTrend.classList.add("tab-content-hidden");
                secServer.classList.add("tab-content-hidden");

                if (tabName === 'controller') {
                    secFaceplate.classList.remove("tab-content-hidden");
                    btnController.classList.add("active");
                } else if (tabName === 'trend') {
                    secTrend.classList.remove("tab-content-hidden");
                    btnTrend.classList.add("active");
                } else if (tabName === 'server') {
                    secServer.classList.remove("tab-content-hidden");
                    btnServer.classList.add("active");
                }
            } else {
                secFaceplate.classList.remove("tab-content-hidden");
                secTrend.classList.remove("tab-content-hidden");
                secServer.classList.remove("tab-content-hidden");
            }
            setTimeout(() => { drawTrendChart(); drawYokogawaFaceplate(); }, 50);
        }

        window.addEventListener("resize", () => {
            if (window.innerWidth > 768) {
                document.getElementById("secFaceplate").classList.remove("tab-content-hidden");
                document.getElementById("secTrend").classList.remove("tab-content-hidden");
                document.getElementById("secServer").classList.remove("tab-content-hidden");
            } else {
                switchMobileTab(state.currentTab);
            }
            drawTrendChart();
            drawYokogawaFaceplate();
        });

        function initWebSocket() {
            const ip = document.getElementById("txtServerIp").value.trim();
            state.wsUrl = `ws://${ip}:8765`;
            if (state.ws) state.ws.close();
            try {
                state.ws = new WebSocket(state.wsUrl);
                state.ws.onopen = () => {
                    const badge = document.getElementById("netStatusBadge");
                    badge.innerText = "TERHUBUNG";
                    badge.className = "status-badge status-connected";
                    sendEuMaxToServer(state.eu_max);
                };
                state.ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.eu_max !== undefined && data.eu_max !== state.eu_max) state.eu_max = data.eu_max;
                    if (data.pv && data.sp && data.mv) {
                        for (let i = 0; i < 5; i++) {
                            const p = state.plants[i];
                            p.pv_pct = euToPct(data.pv[i]);
                            p.sp_pct = euToPct(data.sp[i]);
                            p.mv = data.mv[i];
                            if (data.mode) p.mode = data.mode[i];
                        }
                        updateUIReadouts();
                    }
                };
                state.ws.onclose = () => {
                    const badge = document.getElementById("netStatusBadge");
                    badge.innerText = "TERPUTUS";
                    badge.className = "status-badge status-disconnected";
                };
                state.ws.onerror = () => { if (state.ws) state.ws.close(); };
            } catch (e) { console.error(e); }
        }

        function reconnectServer() { initWebSocket(); }

        function sendSpToServer(plantIdx, spValPct) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({ command: "write_sp", plant_index: plantIdx, sp_value: pctToEu(spValPct) }));
            }
        }
        function sendMvToServer(plantIdx, mvVal) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({ command: "write_mv", plant_index: plantIdx, mv_value: mvVal }));
            }
        }
        function sendEuMaxToServer(euMaxVal) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({ command: "write_eu_max", eu_max: euMaxVal }));
            }
        }
        function sendModeToServer(plantIdx, modeVal) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({ command: "write_mode", plant_index: plantIdx, mode: modeVal }));
            }
        }

        function updateSimulation() {
            state.sim_time += state.dt;
            for (let i = 0; i < 5; i++) {
                const p = state.plants[i];
                p.iae += Math.abs(pctToEu(p.sp_pct) - pctToEu(p.pv_pct)) * state.dt;
                p.spBuffer.push(pctToEu(p.sp_pct));
                p.pvBuffer.push(pctToEu(p.pv_pct));
                p.mvBuffer.push(p.mv);
                p.timeBuffer.push(state.sim_time);
                while (p.spBuffer.length > state.maxPoints) {
                    p.spBuffer.shift(); p.pvBuffer.shift(); p.mvBuffer.shift(); p.timeBuffer.shift();
                }
            }
            drawYokogawaFaceplate();
            drawTrendChart();
        }

        function updateUIReadouts() {
            const p = state.plants[state.activePlantIndex];
            document.getElementById("lblPvVal").innerText = pctToEu(p.pv_pct).toFixed(2);
            document.getElementById("lblSpVal").innerText = pctToEu(p.sp_pct).toFixed(2);
            document.getElementById("lblMvVal").innerText = p.mv.toFixed(1);
            document.getElementById("lblIaeVal").innerText = p.iae.toFixed(2);
            document.getElementById("txtIaeVal").innerText = p.iae.toFixed(2);
        }

        function resetIAE() {
            state.plants[state.activePlantIndex].iae = 0.0;
            updateUIReadouts();
        }

        function changeActivePlant(val) {
            state.activePlantIndex = parseInt(val);
            document.getElementById("fpPlantTitle").innerHTML = `PID #${state.activePlantIndex + 1}<br>Controller`;
            updateUIReadouts();
        }

        function updateTrendConfig() {
            state.dt = state.trendRefreshMs / 1000.0;
            state.maxPoints = Math.max(10, Math.floor(state.trendSpanSec / state.dt));
            if (state.simTimer) clearInterval(state.simTimer);
            state.simTimer = setInterval(updateSimulation, state.trendRefreshMs);
        }

        function changeTrendRefresh(val) { state.trendRefreshMs = parseInt(val) || 100; updateTrendConfig(); }
        function changeTrendSpan(val) { let v = parseFloat(val); if (!isNaN(v) && v > 0) { state.trendSpanSec = v; updateTrendConfig(); } }

        const fpCanvas = document.getElementById("faceplateCanvas");
        const fpCtx = fpCanvas.getContext("2d");

        function drawYokogawaFaceplate() {
            fpCtx.clearRect(0, 0, fpCanvas.width, fpCanvas.height);
            state.blinkState = !state.blinkState;
            const p = state.plants[state.activePlantIndex];

            let indSq = document.getElementById("indSq");
            let boxColor = "#00FF00";
            if (state.alarmStatus === "BAD") boxColor = (!state.alarmAck && state.blinkState) ? "#FF0000" : "#800080";
            indSq.style.backgroundColor = boxColor;
            document.getElementById("lblModeText").innerText = `${p.mode}\n${state.alarmStatus}`;
            document.querySelector(".btn-ack").style.backgroundColor = !state.alarmAck ? "#FF1744" : "#4A5162";

            const barTop = 25, barBottom = 232, barLeft = 88, barRight = 112;
            fpCtx.fillStyle = "#000";
            fpCtx.fillRect(barLeft, barTop, barRight - barLeft, barBottom - barTop);
            fpCtx.strokeRect(barLeft, barTop, barRight - barLeft, barBottom - barTop);

            // PV Bar Fill
            let pvH = (Math.max(0, Math.min(100, p.pv_pct)) / 100.0) * (barBottom - barTop);
            fpCtx.fillStyle = "#00FF00";
            fpCtx.fillRect(barLeft + 2, barBottom - pvH, (barRight - barLeft) - 4, pvH - 1);

            // MV Diamond Indicator (Yellow, Left side)
            let mvY = barBottom - ((Math.max(0, Math.min(100, p.mv)) / 100.0) * (barBottom - barTop));
            fpCtx.fillStyle = "#FFFF00";
            fpCtx.strokeStyle = "#000";
            fpCtx.lineWidth = 1;
            fpCtx.beginPath();
            fpCtx.moveTo(barLeft, mvY);
            fpCtx.lineTo(barLeft - 7, mvY - 5);
            fpCtx.lineTo(barLeft - 14, mvY);
            fpCtx.lineTo(barLeft - 7, mvY + 5);
            fpCtx.closePath();
            fpCtx.fill();
            fpCtx.stroke();

            // SP Diamond Indicator (Red, Right side)
            let spY = barBottom - ((Math.max(0, Math.min(100, p.sp_pct)) / 100.0) * (barBottom - barTop));
            fpCtx.fillStyle = "#FF0000";
            fpCtx.strokeStyle = "#000";
            fpCtx.lineWidth = 1;
            fpCtx.beginPath();
            fpCtx.moveTo(barRight, spY);
            fpCtx.lineTo(barRight + 7, spY - 5);
            fpCtx.lineTo(barRight + 14, spY);
            fpCtx.lineTo(barRight + 7, spY + 5);
            fpCtx.closePath();
            fpCtx.fill();
            fpCtx.stroke();
        }

        const trendCanvas = document.getElementById("trendCanvas");
        const trendCtx = trendCanvas.getContext("2d");

        function drawTrendChart() {
            let wrap = document.getElementById("trendCanvasWrap");
            if (!wrap) return;
            let w = wrap.clientWidth || 300;
            let h = wrap.clientHeight || 200;
            if (w <= 0 || h <= 0) return;

            trendCanvas.width = w;
            trendCanvas.height = h;

            // Trend Background
            trendCtx.fillStyle = "#121417";
            trendCtx.fillRect(0, 0, w, h);

            let padL = 45, padR = 15, padT = 15, padB = 25;
            let chartW = w - padL - padR;
            let chartH = h - padT - padB;

            // Draw Grid Lines (Horizontal & Vertical)
            trendCtx.strokeStyle = "#252B35";
            trendCtx.lineWidth = 1;

            for (let i = 0; i <= 4; i++) {
                let y = padT + (chartH / 4) * i;
                trendCtx.beginPath();
                trendCtx.moveTo(padL, y);
                trendCtx.lineTo(w - padR, y);
                trendCtx.stroke();

                // Y-Axis Value Labels
                let val = state.eu_max - (i / 4) * (state.eu_max - state.eu_min);
                trendCtx.fillStyle = "#A0AAB0";
                trendCtx.font = "9px Consolas, monospace";
                trendCtx.textAlign = "right";
                trendCtx.fillText(val.toFixed(0), padL - 6, y + 3);
            }

            for (let i = 0; i <= 5; i++) {
                let x = padL + (chartW / 5) * i;
                trendCtx.beginPath();
                trendCtx.moveTo(x, padT);
                trendCtx.lineTo(x, padT + chartH);
                trendCtx.stroke();
            }

            // Outer Chart Border
            trendCtx.strokeStyle = "#3A404D";
            trendCtx.lineWidth = 1;
            trendCtx.strokeRect(padL, padT, chartW, chartH);

            const p = state.plants[state.activePlantIndex];
            let currentLen = p.spBuffer.length;
            if (currentLen < 2) return;

            let stepX = chartW / Math.max(1, (state.maxPoints - 1));

            // Helper to draw signal line
            function plotLine(buffer, color, isPct = false) {
                trendCtx.strokeStyle = color;
                trendCtx.lineWidth = 1.5;
                trendCtx.beginPath();
                for (let i = 0; i < currentLen; i++) {
                    let val = buffer[i];
                    let yPct = isPct ? (val / 100.0) : ((val - state.eu_min) / (state.eu_max - state.eu_min));
                    let y = padT + chartH - (yPct * chartH);
                    let x = padL + i * stepX;
                    if (i === 0) trendCtx.moveTo(x, y);
                    else trendCtx.lineTo(x, y);
                }
                trendCtx.stroke();
            }

            // SP (Red), PV (Green), MV (Yellow)
            plotLine(p.spBuffer, "#FF0000", false);
            plotLine(p.pvBuffer, "#00FF00", false);
            plotLine(p.mvBuffer, "#FFFF00", true);
        }

        let activeModalCallback = null;
        function openModal(title, fieldsHtml, onApply, showApplyBtn = true) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalContent").innerHTML = fieldsHtml;
            document.getElementById("btnModalApply").style.display = showApplyBtn ? "inline-block" : "none";
            document.getElementById("modalOverlay").style.display = "flex";
            activeModalCallback = onApply;
        }
        function closeModal() { document.getElementById("modalOverlay").style.display = "none"; activeModalCallback = null; }
        function submitModal() { if (activeModalCallback) activeModalCallback(); closeModal(); }

        function openModeDialog() {
            const p = state.plants[state.activePlantIndex];
            let html = `<label style="grid-column:1/-1;"><input type="radio" name="mOpt" value="AUT" ${p.mode==='AUT'?'checked':''}> AUT</label>` +
                       `<label style="grid-column:1/-1;"><input type="radio" name="mOpt" value="MAN" ${p.mode==='MAN'?'checked':''}> MAN</label>` +
                       `<label style="grid-column:1/-1;"><input type="radio" name="mOpt" value="CAS" ${p.mode==='CAS'?'checked':''}> CAS</label>`;
            openModal("Select Mode", html, () => {
                let sel = document.querySelector('input[name="mOpt"]:checked');
                if (sel) { p.mode = sel.value; sendModeToServer(state.activePlantIndex, p.mode); }
            });
        }

        function openValueDialog(target) {
            const p = state.plants[state.activePlantIndex];
            if (target === "MV" && p.mode !== "MAN") {
                openModal("Peringatan", "<p style='color:#FF1744; grid-column:1/-1;'>Perubahan MV hanya pada Mode MANUAL!</p>", null, false);
                return;
            }
            let currVal = target === "MV" ? p.mv : pctToEu(p.sp_pct);
            let html = `<label>Target ${target}:</label><input type="number" id="valInput" step="any" value="${currVal.toFixed(1)}">`;
            openModal(`Change ${target}`, html, () => {
                let v = parseFloat(document.getElementById("valInput").value);
                if (!isNaN(v)) {
                    if (target === "MV") { p.mv = Math.max(0, Math.min(100, v)); sendMvToServer(state.activePlantIndex, p.mv); }
                    else { p.sp_pct = euToPct(Math.max(state.eu_min, Math.min(state.eu_max, v))); sendSpToServer(state.activePlantIndex, p.sp_pct); }
                }
            });
        }

        function acknowledgeAlarm() { state.alarmAck = true; }

        window.onload = () => {
            initWebSocket();
            if (window.innerWidth <= 768) switchMobileTab('controller');
            updateTrendConfig();
        };
    </script>
